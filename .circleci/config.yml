version: 2.1

orbs:
  node: circleci/node@5.0.1
  docker: circleci/docker@2.8.2

jobs:
  build:
    docker:
      - image: cimg/node:20.0.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Install
          command: npm install
  test:
    docker:
      - image: cimg/node:20.0.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Test
          command: npm run test --if-present

  publish:
    # Use a standard machine image to prevent the orb executor allocation crash
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14

      # The orb command will look for variables in your personal fork project settings
      - docker/check

      - docker/build:
          image: moradhi1/circleci-docker-test
          tag: v1.0.3
      - docker/push:
          image: moradhi1/circleci-docker-test
          tag: v1.0.3

workflows:
  simple_workflow:
    jobs:
      - build
      - test:
          requires:
            - build
      - publish:
          requires:
            - test
