version: 2.1

# orbs
orbs:
  node: circleci/node@5.0.1
  docker: circleci/docker@2.8.2

# jobs
jobs:
  build:
    docker:
      - image: cimg/node:20.0.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run: |
          echo "Installing dependencies..."
          npm install
  test:
    docker:
      - image: cimg/node:20.0.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run: |
          echo "Run tests..."
          npm run test --if-present
  publish:
    executor: docker/docker
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14

      # FIX: Authenticate here. The orb automatically looks for your env variables.
      - docker/check:
          registry-username: DOCKER_LOGIN
          registry-password: DOCKER_PASSWORD

      # Build your testing image (clean and simple parameters)
      - docker/build:
          image: moradhi1/circleci-docker-test
          tag: v1.0.3

      # Push your testing image
      - docker/push:
          image: moradhi1/circleci-docker-test
          tag: v1.0.3

# workflow
workflows:
  simple_workflow:
    jobs:
      - build
      - test:
          requires:
            - build
      - publish:
          requires:
            - test
