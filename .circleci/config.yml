version: 2.1

# orbs
orbs:
  node: circleci/node@5.0.1
  docker: circleci/docker@2.8.2

# jobs
jobs:
  build:
    docker:
      - image: cimg/node:20.0.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run: |
          echo "Installing dependencies..."
          npm install
  test:
    docker:
      - image: cimg/node:20.0.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run: |
          echo "Run tests..."
          npm run test --if-present
  publish:
    docker:
      - image: cimg/base:current # Uses a standard, highly stable Linux environment
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14

      # 1. Standard terminal login using your environment variables
      - run:
          name: "Log in to Docker Hub"
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_LOGIN" --password-stdin

      # 2. Standard terminal build
      - run:
          name: "Build Docker Image"
          command: docker build -t moradhi1/circleci-docker-test:v1.0.3 .

      # 3. Standard terminal push
      - run:
          name: "Push Docker Image"
          command: docker push moradhi1/circleci-docker-test:v1.0.3

# workflow
workflows:
  simple_workflow:
    jobs:
      - build
      - test:
          requires:
            - build
      - publish:
          requires:
            - test
