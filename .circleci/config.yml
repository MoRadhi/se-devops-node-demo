version: 2.1

# orbs
orbs:
  node: circleci/node@5.0.1
  docker: circleci/docker@2.8.2

# jobs
jobs:
  build:
    docker:
      - image: cimg/node:20.0.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run: |
          echo "Installing dependencies..."
          npm install
  test:
    docker:
      - image: cimg/node:20.0.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run: |
          echo "Run tests..."
          npm run test --if-present
  publish:
    executor: docker/docker
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14
      - docker/check

      # FIX: Authenticate before building or pushing
      - docker/login:
          username: DOCKER_LOGIN
          password: DOCKER_PASSWORD

      # Build and push your test image
      - docker/build:
          image: moradhi1/circleci-docker-test
          tag: v1.0.3
      - docker/push:
          image: moradhi1/circleci-docker-test
          tag: v1.0.3

# workflow
workflows:
  simple_workflow:
    jobs:
      - build
      - test:
          requires:
            - build
      - publish:
          requires:
            - test
